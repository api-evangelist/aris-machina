name: Aris Machina
description: >-
  Aris Machina builds AI-powered industrial software for advanced manufacturing,
  describing its mission as delivering "industrial superintelligence" that unifies
  design, production, and operations through AI agents and a shared semantic
  knowledge model. Its products include Protos, an AI co-engineer for R&D teams
  that accelerates design validation and simulation; Gemba, shopfloor operational
  agents that provide real-time equipment diagnostics; and the Ontology Toolkit, a
  knowledge-integration layer that bridges data across MES, ERP, and PLM systems.
  Aris Machina serves batteries, biopharma, robotics, defense, and aerospace, and
  is backed by Earlybird. The company operates from Stockholm, Bangalore, and
  California. This profile was surfaced as an Earlybird portfolio company and
  enriched from public web sources; Aris Machina does not currently publish a
  public developer API surface, OpenAPI specification, or SDKs.
